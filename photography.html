<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="styles.css">
        
</head>

<body>
    <div class="centered-container">
         <img src="images/hero.png" alt="Logo and title" width="500">
    </div>
   
    <nav>
        <div class="nav-logo">
            <a href="index.html">
                <img src="images/logo1.png" alt="Logo" class="logo">
            </a>
        </div>
    
    <div class="nav-links">   
        <a href="index.html">Home</a>
        <a href="photography.html">Photography</a>
        <a href="marketing.html">Marketing</a>
    </div>
    </nav>

    <br>

<div class="photos">
    <img src="images/OC Pier.jpg" alt="Pier reflected in water" width="800">
    
    <img src="images/Old Man.jpg" alt="An old man readng newspaper in park" width="800">

    <img src="images/Crossing.jpg" alt="Man crossing at cross-walk" width="800">

    <img src="images/Smoke Break.jpg" alt="Man browsing phone on smoke break" width="800">

</div>



<button>Click Me</button>

<script>
  window.addEventListener('scroll', function () {
    const logo = document.querySelector('.nav-logo');
    if (window.scrollY > 160) {
      logo.classList.add('visible');
    } else {
      logo.classList.remove('visible');
    }
  });
</script>
    
</body>
</html>
